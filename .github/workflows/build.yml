name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # SDL 版。SDL3 / FreeType はソースから静的に埋め込む（Makefile の dist）
  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, arch: universal, tag: macos-universal, pkg: zip }
          - { os: ubuntu-24.04, arch: x86_64,    tag: linux-x86_64,    pkg: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libegl-dev libgl-dev libdecor-0-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev
      - uses: actions/cache@v6
        with:
          path: |
            out/src
            out/build/${{ matrix.tag }}/deps
          key: deps-${{ matrix.tag }}-${{ hashFiles('Makefile') }}
      - run: make dist ARCH=${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: PC98PLAYER-${{ matrix.tag }}
          path: out/dist/PC98PLAYER-${{ matrix.tag }}.${{ matrix.pkg }}

  # Windows は本家の Win32（GDI）版を MSVC で
  windows:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ARM64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: cmake -S . -B build -A ${{ matrix.arch }}
      - run: cmake --build build --config Release
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp -R build/Release/PC98PLAYER.exe README.md LICENSE THIRD-PARTY-ymfm-LICENSE.txt PC98PLAYER_MANUAL.html manual 設定INI作成.html dist/
      - uses: actions/upload-artifact@v7
        with:
          name: PC98PLAYER-windows-${{ matrix.arch }}
          path: dist/
